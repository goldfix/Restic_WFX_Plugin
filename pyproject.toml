[project]
name = "totalcmd_plugin"
version = "0.1.0"
description = "totalcmd_plugin description"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "google-genai>=1.0.0",
    "duckdb>=1.5.5",
    "jupyter>=1.1.1",
    "polars>=1.44.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
